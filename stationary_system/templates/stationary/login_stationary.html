{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wis Stationary | Login</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'login.css' %}">

    <style>
        /* ============================================================
           MODAL — Fluent dialog (overrides the inline defaults)
           ============================================================ */
        #modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* JS sets style.display = "block" — force flex so it centers */
        #modal[style*="block"] {
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        #modal-content {
            background-color: #fff;
            width: 100%;
            max-width: 380px;
            padding: 24px 22px;
            margin: 0;
            text-align: center;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.14);
            position: relative;
            animation: slideDown 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }

        #modal-message {
            margin: 0 0 18px;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 500;
            color: #1a1a1a;
        }

        #modal-content button {
            width: 100%;
            background-color: #0d9488;
            color: #fff;
            border: 1px solid #0d9488;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 4px;
            font: inherit;
            font-size: 13px;
            font-weight: 600;
            transition: background-color 0.15s ease, border-color 0.15s ease;
        }

        #modal-content button:hover {
            background-color: #0f766e;
            border-color: #0f766e;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to   { opacity: 1; }
        }

        @keyframes slideDown {
            from { transform: translateY(-8px) scale(0.99); opacity: 0; }
            to   { transform: translateY(0) scale(1); opacity: 1; }
        }

        /* ============================================================
           Small form label tweak so labels feel Fluent
           ============================================================ */
        .form-label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: #605e5c;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
            text-align: left;
        }

        .form-group {
            margin-bottom: 14px;
        }
    </style>
</head>

<body>

    <div class="row-holder">

        <!-- ========== BRAND / WELCOME COLUMN (desktop) ========== -->
        <div class="heading-holder-1">
            <span class="hero-pill"
                style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#f0fdfa;color:#0f766e;border:1px solid rgba(13,148,136,0.18);font-size:11px;font-weight:600;letter-spacing:0.03em;text-transform:uppercase;width:fit-content;">
                <i class="fas fa-store"></i> Stationary portal
            </span>
            <h1>Welcome back to Wis Stationary</h1>
            <p>Sign in to manage incoming print, typing and editing requests from your customers.</p>
        </div>

        <!-- ========== LOGIN CARD ========== -->
        <div class="login-form-holder-1">
            <div class="login-form-2">

                <div class="login-avator-2">
                    <button type="button" aria-label="Wis Stationary">
                        <img src="{% static 'icons/stationary1.png' %}" alt="Wis Stationary">
                    </button>
                </div>

                <h2>Sign in to your account</h2>
                <p>Enter your stationary ID and password to continue.</p>

                <form id="loginForm" method="post">
                    {% csrf_token %}

                    <div class="form-group">
                        <label class="form-label" for="stationaryId">Stationary ID</label>
                        <div class="inputs-3">
                            <input type="text" id="stationaryId" name="username" required
                                autocomplete="username" placeholder="Enter your stationary ID">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <div class="inputs-3">
                            <input type="password" id="password" name="password" required
                                autocomplete="current-password" placeholder="Enter your password">
                        </div>
                    </div>

                    <div class="inputs-3 button-3">
                        <input type="submit" value="Login" style="color: inherit; font-weight: 600;">
                    </div>
                </form>

            </div>
        </div>

    </div>

    <!-- ========== MODAL ========== -->
    <div id="modal">
        <div id="modal-content">
            <p id="modal-message"></p>
            <button id="modal-close-btn">Close</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const loginButton = loginForm.querySelector('input[type="submit"]');

        function openModal(message) {
            modalMessage.textContent = message;
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Close modal on button click
        modalCloseBtn.addEventListener('click', closeModal);

        // Close modal when clicking outside modal content
        window.addEventListener('click', function (e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault(); // prevent normal form submit

            // Disable button and show "Logging in..."
            loginButton.disabled = true;
            const originalText = loginButton.value;
            loginButton.value = "Logging in...";

            const formData = new FormData(loginForm);

            fetch("", {
                method: "POST",
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                },
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    openModal(data.message);

                    if (data.status === 'success' && data.redirect_url) {
                        setTimeout(() => {
                            window.location.href = data.redirect_url;
                        }, 1500); // redirect after 1.5 seconds
                    } else {
                        // Re-enable button and restore text if login failed
                        loginButton.disabled = false;
                        loginButton.value = originalText;
                    }
                })
                .catch(error => {
                    openModal('An error occurred. Please try again.');
                    console.error('Error:', error);
                    loginButton.disabled = false;
                    loginButton.value = originalText;
                });
        });
    </script>

</body>

</html>
