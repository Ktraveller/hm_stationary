{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eStationary | 404</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'customer_css/dashboard.css' %}">

    <style>
        .content-holder-4 {
            width: 100%;
            height: 100%;
        }

        .dash-content-5 {
            width: 100%;
            height: 500px;
            margin: auto;
            background: rgba(255, 255, 255, 0.15);
            /* transparent glass */
            backdrop-filter: blur(10px);
            /* blur effect */
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .dash-content-5>button {
            width: 100%;
            height: 100%;
            background: transparent;
            font-weight: bold;
            border-style: none;
        }

        .dash-content-5>button>a {
            text-decoration: none;
            color: dodgerblue;
        }
    </style>
</head>

<body>
    <!-- Page loader -->
    <div id="page-loader">
        <div class="spinner"></div>
    </div>

    <div class="row-holder-1" style="height: 1000px;">


        <div class="content-holder-4">
            <div class="dash-content-5">
                <button type="button"><b style="font-size: 30px;">404</b> <br><br>
                     Sorry, the page that you looking not exist!. <br> go to <a href="{% url 'customer_dashboard' %}">Dashboard</a></button>
            </div>
        </div>


    </div>
    <script>
        const USER_ID = "{{ request.user.id }}";
        const USER_TYPE = "customer";
    </script>
    <script src="{% static 'customer_js/dashboard.js' %}"></script>
    <script src="{% static 'customer_js/notifications.js' %}"></script>
    <script>
        window.addEventListener("load", function () {
            const loader = document.getElementById("page-loader");
            loader.style.transition = "opacity 0.5s ease";
            loader.style.opacity = "0";
            setTimeout(() => loader.style.display = "none", 500);
        });
    </script>
</body>

</html>
