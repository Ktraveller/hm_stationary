{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM-Stationary | Register stationary</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'admin_css/dashboard.css' %}">
    <link rel="stylesheet" href="{% static 'admin_css/activities.css' %}">
</head>

<body>
    <div class="row-holder-1">

        <div class="heading-holder-2">

            <div class="title-holder-21">
                <div class="menu-holder-22">
                    <button type="button" class="b1" id="button1" onclick="nav_bar('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button type="button" class="b2" id="button2" onclick="nav_bar('close')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button type="button"><span style="font-weight: bold;">HM-Stationary</span></button>
                </div>
            </div>

            <div class="actions-holder-22">
                <button type="button" onclick="window.location.href = `{% url 'admin_notifications' %}`">
                    <i class="fas fa-bell"></i>
                </button>
                <button type="button" onclick="window.location.href = `{% url 'admin_user' %}`">
                    <i class="fas fa-user"></i>
                </button>
            </div>

        </div>


        <div class="navigation-bar-holder-3" id="nav_bar">
            <div class="navigation-holder-4">

                <br>

                <div class="site-icon-holder">
                    <button type="button">
                        <img src="{% static 'icons/stationary1.png' %}" alt="site-icon">
                    </button>
                </div>

                <br>

                <ul>
                    <a href="{% url 'admin_dashboard' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-chart-line"></i>
                            </button>
                            <button type="button">Dashboard</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_activities' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-history"></i>
                            </button>
                            <button type="button">Activities</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_stationaries' %}">
                        <li class="active-bar">
                            <button type="button">
                                <i class="fas fa-box"></i>
                            </button>
                            <button type="button">Stationaries</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_customers' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-users"></i>
                            </button>
                            <button type="button">Customers</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_payments' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-credit-card"></i>
                            </button>
                            <button type="button">Payments</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_logout' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                            <button type="button">Logout</button>
                        </li>
                    </a>
                </ul>

            </div>
        </div>


        <div class="content-holder-4">
            <div class="dash-content-5">
                <p style="font-weight: bold;">Register stationary</p>
                <div class="activities-table-holder-6">
                    <div class="activities-table-holder-6">

                        <!-- Display messages -->
                        {% if messages %}
                        <div class="message-container">
                            {% for m in messages %}
                            <div class="alert {{ m.tags }}">
                                {{ m }}
                            </div>
                            {% endfor %}
                        </div>
                        {% endif %}

                        <form action="{% url 'register_validation' %}" method="post">
                            {% csrf_token %}

                            <p style="font-weight: bold;">Stationary identification</p>
                            <p>Stationary name</p>
                            <div class="inputs-holder-6">
                                <input type="text" name="stationary_name" required>
                            </div>

                            <p>Phone number</p>
                            <div class="inputs-holder-6">
                                <input type="text" name="phone" required>
                            </div>

                            <p>Email (optional)</p>
                            <div class="inputs-holder-6">
                                <input type="email" name="email">
                            </div>

                            <br><br>
                            <p style="font-weight: bold;">Payment information</p>
                            <p>Payment number</p>
                            <div class="inputs-holder-6">
                                <input type="number" name="payment_number" required>
                            </div>

                            <p>Payment name</p>
                            <div class="inputs-holder-6">
                                <input type="text" name="payment_name" required>
                            </div>

                            <br><br>

                            <div class="inputs-holder-7">
                                <button type="submit">Next</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>
    <script>
        var c = document.getElementById('nav_bar');
        var b1 = document.getElementById('button1');
        var b2 = document.getElementById('button2');
        function nav_bar(click) {
            if (click == "open") {
                c.style.display = "inline-block";
                b1.style.display = "none";
                b2.style.display = "inline-block";
            }
            else {
                c.style.display = "none";
                b1.style.display = "inline-block";
                b2.style.display = "none";
            }
        }
    </script>
</body>

</html>
