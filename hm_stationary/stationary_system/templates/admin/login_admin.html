{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM-Stationary | Login</title>    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"> 
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>

<body>
    <div class="row-holder">
        <p style="font-weight: bold; color: white;">HM-Stationary | Login</p>

        <div class="login-form-holder-1">
            <div class="login-form-2">
                <div class="login-avator-2">
                    <button type="button">
                        <img src="{% static 'icons/stationary1.png' %}" alt="">
                    </button>
                </div>

                <br>

                <form action="" method="post">
                    {% csrf_token %}
                    <span style="font-weight: bold;">Username</span>
                    <div class="inputs-3">
                        <input type="text" name="username" required>
                    </div>
                    <br>
                    <span style="font-weight: bold;">Password</span>
                    <div class="inputs-3">
                        <input type="password" name="password" required>
                    </div>
                    <br>
                    <div class="inputs-3 button-3">
                        <input type="submit" value="Login" style="color: inherit;">
                    </div>
                </form>

                <div id="popup-container"></div>

                <!-- Convert messages to a list of dicts -->
                {% if messages %}
                <script type="application/json" id="messages-json">
                    [
                    {% for message in messages %}
                    {"message": "{{ message|escapejs }}", "tags": "{{ message.tags }}"}{% if not forloop.last %},{% endif %}
                    {% endfor %}
                    ]
                </script>
                {% endif %}

            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('popup-container');
            const messagesScript = document.getElementById('messages-json');
            if (!messagesScript) return;

            const djangoMessages = JSON.parse(messagesScript.textContent);

            djangoMessages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('popup-message');

                if (msg.tags) {
                    msgDiv.classList.add('popup-' + msg.tags);
                }

                msgDiv.innerText = msg.message;
                container.appendChild(msgDiv);

                setTimeout(() => { msgDiv.remove(); }, 3000);
            });
        });
    </script>
</body>

</html>
