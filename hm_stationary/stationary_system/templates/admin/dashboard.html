{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM-Stationary | Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'admin_css/dashboard.css' %}">
</head>

<body>
    <div class="row-holder-1">

        <div class="heading-holder-2">

            <div class="title-holder-21">
                <div class="menu-holder-22">
                    <button type="button" class="b1" id="button1" onclick="nav_bar('open')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button type="button" class="b2" id="button2" onclick="nav_bar('close')">
                        <i class="fas fa-bars"></i>
                    </button>
                    <button type="button"><span style="font-weight: bold;">HM-Stationary</span></button>
                </div>
            </div>

            <div class="actions-holder-22">
                <button type="button" onclick="window.location.href = `{% url 'admin_notifications' %}`">
                    <i class="fas fa-bell"></i>
                </button>
                <button type="button" onclick="window.location.href = `{% url 'admin_user' %}`">
                    <i class="fas fa-user"></i>
                </button>
            </div>

        </div>


        <div class="navigation-bar-holder-3" id="nav_bar">
            <div class="navigation-holder-4">

                <br>

                <div class="site-icon-holder">
                    <button type="button">
                        <img src="{% static 'icons/stationary1.png' %}" alt="site-icon">
                    </button>
                </div>

                <br>

                <ul>
                    <a href="{% url 'admin_dashboard' %}">
                        <li class="active-bar">
                            <button type="button">
                                <i class="fas fa-chart-line"></i>
                            </button>
                            <button type="button">Dashboard</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_activities' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-history"></i>
                            </button>
                            <button type="button">Activities</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_stationaries' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-box"></i>
                            </button>
                            <button type="button">Stationaries</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_customers' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-users"></i>
                            </button>
                            <button type="button">Customers</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_payments' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-credit-card"></i>
                            </button>
                            <button type="button">Payments</button>
                        </li>
                    </a>
                </ul>

                <ul>
                    <a href="{% url 'admin_logout' %}">
                        <li>
                            <button type="button">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                            <button type="button">Logout</button>
                        </li>
                    </a>
                </ul>

            </div>
        </div>


        <div class="content-holder-4">
            <div class="dash-content-5">
                <div class="services-container-holder-6">
                    <div>
                        <div class="service-holder-7">
                            <button type="button">
                                <b>{{ total_stationary }}</b>
                            </button>
                            <p style="font-weight: bold;">Stationaries</p>
                        </div>
                    </div>

                    <div>
                        <div class="service-holder-7">
                            <button type="button">
                                <b>{{ total_activities }}</b>
                            </button>
                            <p style="font-weight: bold;">Activities</p>
                        </div>
                    </div>

                    <div>
                        <div class="service-holder-7">
                            <button type="button">
                                <b>{{ total_customers }}</b>
                            </button>
                            <p style="font-weight: bold;">Customers</p>
                        </div>
                    </div>

                    <div style="width: 100%;">
                        <div class="service-holder-7" style="font-weight: bold;">
                            <p>Total activities costs: <b style="color: teal; float: right;">{{ total_costs }} Tsh</b></p>
                            <hr color="teal">
                            <p>Total costs payed: <b style="color: red; float: right;">{{ total_payments }} Tsh</b></p>
                            <hr color="teal">
                            <p>Total income: <b style="color: green; float: right;">{{ income }} Tsh</b></p>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="footer-holder-5">
            <p>&copy; 2026 HM-Stationary. All rights reserved.</p>
        </div>

    </div>
    <script>
        var c = document.getElementById('nav_bar');
        var b1 = document.getElementById('button1');
        var b2 = document.getElementById('button2');
        function nav_bar(click) {
            if (click == "open") {
                c.style.display = "inline-block";
                b1.style.display = "none";
                b2.style.display = "inline-block";
            }
            else {
                c.style.display = "none";
                b1.style.display = "inline-block";
                b2.style.display = "none";
            }
        }
    </script>
</body>

</html>
