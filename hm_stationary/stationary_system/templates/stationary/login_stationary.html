{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HM-Stationary | Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'login.css' %}">
    <style>
        /* Modal overlay */
        #modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.3s;
        }

        /* Modal content */
        #modal-content {
            background-color: #fff;
            padding: 20px;
            margin: 15% auto;
            width: 300px;
            text-align: center;
            border-radius: 5px;
            position: relative;
            animation: slideDown 0.3s;
        }

        /* Teal button */
        #modal-content button {
            background-color: teal;
            color: #fff;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        #modal-content button:hover {
            background-color: #006666;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body>
    <div class="row-holder">
        <p style="font-weight: bold; color: white;">HM-Stationary | Login</p>

        <div class="login-form-holder-1">
            <div class="login-form-2">
                <div class="login-avator-2">
                    <button type="button">
                        <img src="{% static 'icons/stationary1.png' %}" alt="">
                    </button>
                </div>

                <br>

                <form id="loginForm" method="post">
                    {% csrf_token %}
                    <span style="font-weight: bold;">Write stationary ID</span>
                    <div class="inputs-3">
                        <input type="text" name="username" required>
                    </div>
                    <br>
                    <span style="font-weight: bold;">Password</span>
                    <div class="inputs-3">
                        <input type="password" name="password" required>
                    </div>
                    <br>
                    <div class="inputs-3 button-3">
                        <input type="submit" value="Login" style="color: inherit; font-weight: bold;">
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div id="modal">
        <div id="modal-content">
            <p id="modal-message"></p>
            <button id="modal-close-btn">Close</button>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const modalMessage = document.getElementById('modal-message');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const loginButton = loginForm.querySelector('input[type="submit"]');

        function openModal(message) {
            modalMessage.textContent = message;
            modal.style.display = 'block';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Close modal on button click
        modalCloseBtn.addEventListener('click', closeModal);

        // Close modal when clicking outside modal content
        window.addEventListener('click', function (e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        loginForm.addEventListener('submit', function (e) {
            e.preventDefault(); // prevent normal form submit

            // Disable button and show "Logging in..."
            loginButton.disabled = true;
            const originalText = loginButton.value;
            loginButton.value = "Logging in...";

            const formData = new FormData(loginForm);

            fetch("", {
                method: "POST",
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                },
                body: formData
            })
                .then(response => response.json())
                .then(data => {
                    openModal(data.message);

                    if (data.status === 'success' && data.redirect_url) {
                        setTimeout(() => {
                            window.location.href = data.redirect_url;
                        }, 1500); // redirect after 1.5 seconds
                    } else {
                        // Re-enable button and restore text if login failed
                        loginButton.disabled = false;
                        loginButton.value = originalText;
                    }
                })
                .catch(error => {
                    openModal('An error occurred. Please try again.');
                    console.error('Error:', error);
                    loginButton.disabled = false;
                    loginButton.value = originalText;
                });
        });
    </script>
</body>

</html>
